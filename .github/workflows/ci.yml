name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # PostgreSQL 后端对齐测试：service 容器注入 DSN，无 DSN 的环境自动跳过。
    # 镜像用 timescaledb（PG 16 完全兼容），顺带验证 hypertable 自动启用路径
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: liniot
          POSTGRES_PASSWORD: liniot
          POSTGRES_DB: liniot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liniot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINIOT_TEST_PG_DSN: postgresql://liniot:liniot@127.0.0.1:5432/liniot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Test
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: node --check web/app.js
