services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  liniot:
    build: .
    ports:
      - "8000:8000"
    environment:
      LINIOT_MQTT_HOST: mosquitto
      LINIOT_MQTT_PORT: "1883"
      # LINIOT_AI_API_KEY: sk-xxx        # 可选：启用大模型助手
      # LINIOT_AI_BASE_URL: https://api.openai.com/v1
      # LINIOT_AI_MODEL: gpt-4o-mini
      # LINIOT_WEBHOOK_URL: http://host.docker.internal:9000/alert  # 可选：告警回调
      # LINIOT_DB_URL: postgresql://liniot:liniot@postgres:5432/liniot  # 可选：PG 后端（配合 --profile postgres）
    volumes:
      - liniot-data:/data
    depends_on:
      - mosquitto

  # 可选：PostgreSQL 存储后端。docker compose --profile postgres up -d postgres
  # 后在 liniot 环境里取消 LINIOT_DB_URL 注释并重启（需镜像内含 psycopg，见 README）
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: liniot
      POSTGRES_PASSWORD: liniot
      POSTGRES_DB: liniot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 可选：TimescaleDB（PG 后端的时序增强版，PG 16 兼容）。
  # docker compose --profile timescale up -d timescale
  # 平台启动时自动探测扩展并把 telemetry 转为按天分块的 hypertable
  timescale:
    image: timescale/timescaledb:latest-pg16
    profiles: ["timescale"]
    environment:
      POSTGRES_USER: liniot
      POSTGRES_PASSWORD: liniot
      POSTGRES_DB: liniot
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data

volumes:
  liniot-data:
  pgdata:
  tsdata:
